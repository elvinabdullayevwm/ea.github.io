<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luxury Store</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 🔥 YUXARI QIZILI -->
<div class="top-gold"></div>

<header>
  <h1>Luxury Store</h1>
  <nav>
    <a href="#">Ana səhifə</a>
    <a href="#">Məhsullar</a>
    <a href="#">Əlaqə</a>
  </nav>
</header>

<section class="hero">
  <h2>Brend Parfümeriya & Kosmetika</h2>
  <p>Orijinal məhsullar – Premium keyfiyyət</p>
</section>

<section class="products" id="productList"></section>

  <div class="card">
    <img src="img/dior.jpg">
    <h3>Dior Sauvage</h3>
    <p>220 AZN</p>
    <button>Al</button>
  </div>

  <div class="card">
    <img src="img/mac.jpg">
    <h3>MAC Lipstick</h3>
    <p>70 AZN</p>
    <button>Al</button>
  </div>

</section>

<!-- 🔥 AŞAĞI QIZILI -->
<div class="bottom-gold"></div>

  <script>
let productList = document.getElementById("productList");

let products = JSON.parse(localStorage.getItem("products")) || [
  {
    name: "Chanel No.5",
    price: "250 AZN",
    image: "img/chanel.jpg"
  },
  {
    name: "Dior Sauvage",
    price: "220 AZN",
    image: "img/dior.jpg"
  },
  {
    name: "MAC Lipstick",
    price: "70 AZN",
    image: "img/mac.jpg"
  }
];

products.forEach(p => {
  productList.innerHTML += `
    <div class="card">
      <img src="${p.image}">
      <h3>${p.name}</h3>
      <p>${p.price}</p>
      <button>Al</button>
    </div>
  `;
});
</script>
</body>
</html>
